<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShipKernel Preview</title>
  <!-- Locally vendored runtimes (no CDN fragility) -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/remix-router.umd.min.js"></script>
  <script src="/vendor/react-router.production.min.js"></script>
  <script src="/vendor/react-router-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/vendor/framer-motion.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons optional; LucideReact stubs if CDN blocked -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" onerror="console.warn('lucide CDN skipped')"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style id="vfs-user-styles"></style>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #fff; }
    body { font-family: Inter, system-ui, sans-serif; }
    #root { min-height: 100vh; }
    #boot {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #0a0a0b; color: #a3a3a3;
      font: 12px/1.4 Inter, system-ui, sans-serif; letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="root"><div id="boot">Starting preview…</div></div>
  <script>
    let vfs = {};
    let lastEntry = "App.tsx";
    let renderToken = 0;
    let lastGoodHtml = null;

    function getRouterLib() {
      const raw = window.ReactRouterDOM || window.ReactRouter || {};
      // MemoryRouter is reliable inside iframes; HashRouter often crashes with parent history
      const Memory = raw.MemoryRouter || raw.HashRouter || raw.BrowserRouter;
      const Browser = raw.BrowserRouter || Memory;
      const Hash = Memory || raw.HashRouter;
      return new Proxy(raw, {
        get(target, prop) {
          if (prop === "HashRouter") return Hash;
          if (prop === "BrowserRouter") return Browser;
          if (prop === "MemoryRouter") return Memory || target[prop];
          const v = target[prop];
          return v;
        },
      });
    }

    function buildIconComponent() {
      return function Icon({ name, size = 20, strokeWidth = 2, className = "", ...props }) {
        try {
          const lib = window.lucide;
          if (!lib || !lib.icons) return null;
          const iconData = lib.icons[name] || lib.icons.HelpCircle || lib.icons.Box;
          if (!iconData) return null;
          return React.createElement(
            "svg",
            {
              xmlns: "http://www.w3.org/2000/svg",
              width: size,
              height: size,
              viewBox: "0 0 24 24",
              fill: "none",
              stroke: "currentColor",
              strokeWidth,
              strokeLinecap: "round",
              strokeLinejoin: "round",
              className: "lucide lucide-" + String(name || "box").toLowerCase() + " " + className,
              ...props,
            },
            (iconData[2] || []).map(([tag, attrs]) => React.createElement(tag, attrs))
          );
        } catch {
          return null;
        }
      };
    }

    function ensureDeps() {
      if (!window.React || !window.ReactDOM) {
        throw new Error("React failed to load. Check network / CDN.");
      }
      window.process = window.process || { env: { NODE_ENV: "production" } };
      window.framerMotion = window.Motion || window.framerMotion || window.framerMotion;
      // framer-motion UMD global varies by version
      if (!window.framerMotion && window.Motion) window.framerMotion = window.Motion;

      window.Icon = buildIconComponent();
      window.LucideReact = new Proxy(
        {},
        {
          get(_t, name) {
            if (typeof name !== "string") return undefined;
            return (props) => React.createElement(window.Icon, { name, ...props });
          },
        }
      );

      const rr = getRouterLib();
      window.__ShipKernelRouter = rr;
      if (!rr.MemoryRouter && !rr.HashRouter) {
        console.warn("[Preview] react-router-dom UMD missing router components");
      }

      if (window.supabase?.createClient) {
        window._supabase_lib = window.supabase;
      }
    }

    function ensureSupabase() {
      if (window._SUPABASE_URL && window._SUPABASE_KEY && window._supabase_lib?.createClient) {
        try {
          const client = window._supabase_lib.createClient(window._SUPABASE_URL, window._SUPABASE_KEY);
          window.supabase = client;
          window.Supabase = client;
          window.supabaseClient = client;
        } catch (_) {}
      }
    }

    function injectCss() {
      const styleEl = document.getElementById("vfs-user-styles");
      if (!styleEl) return;
      styleEl.textContent = Object.entries(vfs)
        .filter(([path]) => path.endsWith(".css"))
        .map(([, content]) => content)
        .join("\n");
    }

    function post(type, payload) {
      try {
        window.parent.postMessage({ type, ...payload }, "*");
      } catch (_) {}
    }

    // Soft app issues (Supabase schema, async fetch failures, etc.) don't crash React —
    // without this, agent marks "Preview healthy" while the UI shows a red error banner.
    let lastAppIssue = "";
    let appIssueProbeTimers = [];
    const APP_ISSUE_RE =
      /could not find the table|schema cache|PGRST\d+|relation ["`].+["`] does not exist|column .+ does not exist|JWT expired|invalid (api|jwt) key|Failed to fetch|NetworkError|TypeError:|ReferenceError:|is not defined|Cannot read propert|permission denied|row-level security| foreig?n key|duplicate key|violates|supabase.*error|AuthApiError|PostgrestError/i;

    function isActionableIssue(text) {
      return Boolean(text && APP_ISSUE_RE.test(String(text)));
    }

    function extractIssueSnippet(text) {
      const raw = String(text || "").replace(/\s+/g, " ").trim();
      const m = raw.match(
        /Could not find the table[^.]{0,120}|PGRST\d+[^.]{0,120}|relation [^.]{0,80}|TypeError:[^.]{0,120}|ReferenceError:[^.]{0,120}|Failed to fetch[^.]{0,80}|[^.!?\n]{0,160}(?:schema cache|does not exist|row-level security)[^.!?\n]{0,80}/i
      );
      return (m ? m[0] : raw).slice(0, 220);
    }

    function reportAppIssue(msg, source) {
      const clean = extractIssueSnippet(msg);
      if (!clean || !isActionableIssue(clean)) return;
      if (clean === lastAppIssue) return;
      lastAppIssue = clean;
      post("RUNTIME_ERROR", {
        error: clean,
        stack: source ? "app-issue:" + source : "app-issue",
      });
    }

    function clearAppIssueProbes() {
      for (const t of appIssueProbeTimers) clearTimeout(t);
      appIssueProbeTimers = [];
    }

    function scheduleAppIssueProbes(token) {
      clearAppIssueProbes();
      lastAppIssue = "";
      const run = (label) => {
        if (token !== renderToken) return;
        try {
          const root = document.getElementById("root");
          const text = (root && (root.innerText || root.textContent)) || "";
          if (isActionableIssue(text)) reportAppIssue(text, "dom:" + label);
        } catch (_) {}
      };
      // Async data errors often appear after first paint
      appIssueProbeTimers.push(setTimeout(() => run("900ms"), 900));
      appIssueProbeTimers.push(setTimeout(() => run("2200ms"), 2200));
    }

    function installGlobalIssueBridges() {
      if (window.__skIssueBridges) return;
      window.__skIssueBridges = true;

      window.addEventListener("error", (e) => {
        reportAppIssue(e && (e.message || (e.error && e.error.message) || e.error), "window.onerror");
      });
      window.addEventListener("unhandledrejection", (e) => {
        const r = e && e.reason;
        const msg =
          (r && (r.message || r.error_description || r.details || r.hint)) ||
          (typeof r === "string" ? r : "") ||
          "Unhandled promise rejection";
        reportAppIssue(msg, "unhandledrejection");
      });

      const origError = console.error;
      console.error = function () {
        try {
          const parts = [];
          for (let i = 0; i < arguments.length; i++) {
            const a = arguments[i];
            if (typeof a === "string") parts.push(a);
            else if (a && typeof a === "object") {
              parts.push(a.message || a.error_description || a.details || JSON.stringify(a));
            } else if (a != null) parts.push(String(a));
          }
          reportAppIssue(parts.join(" "), "console.error");
        } catch (_) {}
        return origError.apply(console, arguments);
      };
    }

    installGlobalIssueBridges();

    function ErrorBoundaryFactory() {
      return class PreviewErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }
        static getDerivedStateFromError(error) {
          return { error };
        }
        componentDidCatch(error, info) {
          const message = String(error?.message || error);
          const stack = [error?.stack, info?.componentStack].filter(Boolean).join("\n");
          post("RUNTIME_ERROR", { error: message, stack });
          post("PREVIEW_STATUS", { status: "error", message });
        }
        render() {
          if (this.state.error) {
            const msg = String(this.state.error?.message || this.state.error);
            return React.createElement(
              "div",
              {
                style: {
                  boxSizing: "border-box",
                  padding: "1.25rem",
                  minHeight: "100vh",
                  background: "#0a0a0b",
                  color: "#f87171",
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                },
              },
              React.createElement(
                "h2",
                { style: { margin: "0 0 0.75rem", color: "#fff", fontSize: "0.95rem" } },
                "Preview crashed"
              ),
              React.createElement(
                "div",
                {
                  style: {
                    border: "1px solid #7f1d1d",
                    borderRadius: 8,
                    padding: "0.875rem",
                    background: "#111",
                    color: "#fecaca",
                    fontSize: 13,
                    lineHeight: 1.45,
                    wordBreak: "break-word",
                  },
                },
                msg
              ),
              React.createElement(
                "p",
                { style: { marginTop: 12, color: "#737373", fontSize: 11 } },
                "Ask the agent to fix this error, or simplify routing (avoid nested routers)."
              )
            );
          }
          return this.props.children;
        }
      };
    }

    function resolvePath(path, currentFile) {
      if (path.startsWith("@/")) path = path.slice(2);
      if (!path.startsWith(".")) {
        const extensions = ["", ".tsx", ".ts", ".js", ".jsx", "/index.tsx", "/index.ts", "/index.js"];
        for (const ext of extensions) {
          if (vfs[path + ext]) return path + ext;
        }
        return path;
      }
      const parts = currentFile.split("/");
      parts.pop();
      for (const part of path.split("/")) {
        if (part === "..") parts.pop();
        else if (part !== ".") parts.push(part);
      }
      let resolved = parts.join("/");
      const extensions = ["", ".tsx", ".ts", ".js", ".jsx", "/index.tsx", "/index.ts", "/index.js"];
      for (const ext of extensions) {
        if (vfs[resolved + ext]) return resolved + ext;
      }
      return resolved;
    }

    function createRequire(moduleCache) {
      return function require(path, currentFile) {
        if (path === "react") return window.React;
        if (path === "react/jsx-runtime" || path === "react/jsx-dev-runtime") {
          return {
            jsx: React.createElement,
            jsxs: React.createElement,
            Fragment: React.Fragment,
          };
        }
        if (path === "react-dom" || path === "react-dom/client") return window.ReactDOM;
        if (path === "lucide-react") return window.LucideReact;
        if (path === "framer-motion") return window.framerMotion || window.Motion || {};
        if (path === "react-router-dom") return window.__ShipKernelRouter || getRouterLib();
        if (path === "react-router") return window.__ShipKernelRouter || getRouterLib();
        if (path === "@supabase/supabase-js") return window._supabase_lib;
        if (path === "sonner") {
          const toast = Object.assign((m) => console.log("[Toast]", m), {
            success: (m) => console.log("[Toast Success]", m),
            error: (m) => console.log("[Toast Error]", m),
            loading: (m) => console.log("[Toast Loading]", m),
          });
          return { toast, Toaster: () => null };
        }
        if (
          path === "@/lib/supabase" ||
          path === "@/integrations/supabase/client" ||
          path === "./lib/supabase" ||
          path === "../lib/supabase"
        ) {
          return { supabase: window.supabase, default: window.supabase };
        }
        if (path.endsWith(".css") || resolvePath(path, currentFile).endsWith(".css")) {
          return {};
        }

        const resolved = resolvePath(path, currentFile);
        if (moduleCache[resolved]) return moduleCache[resolved].exports;

        const fileContent = vfs[resolved];
        if (!fileContent) {
          throw new Error(`Module not found: ${path} (from ${currentFile} → ${resolved})`);
        }

        const metaPlugin = ({ types: t }) => ({
          visitor: {
            MetaProperty(p) {
              if (p.node.meta.name === "import" && p.node.property.name === "meta") {
                p.replaceWith(t.identifier("window._import_meta_mock"));
              }
            },
          },
        });

        let transformed;
        try {
          transformed = Babel.transform(fileContent, {
            presets: [
              ["react", { runtime: "classic" }],
              "typescript",
              ["env", { modules: "commonjs", targets: { browsers: "last 2 chrome versions" } }],
            ],
            plugins: [metaPlugin],
            filename: resolved,
          }).code;
        } catch (babelErr) {
          throw new Error(`Compile error in ${resolved}: ${babelErr.message || babelErr}`);
        }

        const module = { exports: {} };
        moduleCache[resolved] = module;
        try {
          const wrapper = new Function(
            "require",
            "exports",
            "module",
            "__filename",
            "React",
            transformed
          );
          wrapper(
            (p) => require(p, resolved),
            module.exports,
            module,
            resolved,
            window.React
          );
        } catch (runtimeErr) {
          delete moduleCache[resolved];
          throw runtimeErr;
        }
        return module.exports;
      };
    }

    function showError(err) {
      const rootEl = document.getElementById("root");
      if (window.reactRoot) {
        try {
          window.reactRoot.unmount();
          window.reactRoot = null;
        } catch (_) {}
      }
      const msg = String(err && (err.message || err)).replace(/</g, "&lt;");
      const stack = String((err && err.stack) || "").replace(/</g, "&lt;");
      rootEl.innerHTML =
        '<div style="box-sizing:border-box;padding:1.25rem;color:#f87171;font-family:ui-monospace,Menlo,monospace;background:#0a0a0b;min-height:100vh;overflow:auto;">' +
        '<h2 style="margin:0 0 0.75rem;color:#fff;font-size:1rem;">Preview Error</h2>' +
        '<div style="border:1px solid #7f1d1d;padding:0.875rem;border-radius:8px;background:#111;overflow:hidden;">' +
        '<div style="word-break:break-word;font-size:0.8125rem;line-height:1.45;color:#fecaca;"><strong>Error:</strong> ' +
        msg +
        "</div>" +
        (stack
          ? '<pre style="margin:0.75rem 0 0;opacity:0.55;font-size:0.7rem;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;">' +
            stack +
            "</pre>"
          : "") +
        "</div></div>";
      post("RUNTIME_ERROR", { error: String(err && (err.message || err)), stack: String(err && err.stack || "") });
      post("PREVIEW_STATUS", { status: "error", message: String(err && (err.message || err)) });
    }

    function renderVFS(entryFile, opts) {
      const soft = opts && opts.soft;
      const token = ++renderToken;
      const rootEl = document.getElementById("root");
      const moduleCache = {};
      injectCss();

      window._import_meta_mock = {
        env: {
          VITE_SUPABASE_URL: window._SUPABASE_URL || "",
          VITE_SUPABASE_PUBLISHABLE_KEY: window._SUPABASE_KEY || "",
        },
      };

      const require = createRequire(moduleCache);

      try {
        if (!entryFile || !vfs[entryFile]) {
          const keys = Object.keys(vfs);
          entryFile = keys.find((k) => /App\.(tsx|jsx|js)$/i.test(k)) || keys[0];
        }
        if (!entryFile) throw new Error("No files in workspace yet.");

        const entryModule = require("./" + entryFile, "index.js");
        let Component = entryModule.default || entryModule.App || entryModule;
        if (Component && typeof Component === "object" && Component.__esModule && Component.default) {
          Component = Component.default;
        }
        if (!Component || (typeof Component !== "function" && typeof Component !== "object")) {
          throw new Error('Entry "' + entryFile + '" did not export a React component.');
        }

        if (token !== renderToken) return;

        if (window.reactRoot) {
          try {
            window.reactRoot.unmount();
          } catch (_) {}
          window.reactRoot = null;
        }
        // clear boot markup so createRoot mounts cleanly
        rootEl.innerHTML = "";
        const Boundary = ErrorBoundaryFactory();
        window.reactRoot = ReactDOM.createRoot(rootEl);
        window.reactRoot.render(
          React.createElement(Boundary, null, React.createElement(Component))
        );
        lastEntry = entryFile;
        post("PREVIEW_STATUS", {
          status: "live",
          entry: entryFile,
          files: Object.keys(vfs).length,
        });
        post("PREVIEW_RENDERED", { entry: entryFile });
        // Hard renders only — soft mid-build graphs are intentionally incomplete
        if (!soft) scheduleAppIssueProbes(token);
      } catch (err) {
        clearAppIssueProbes();
        if (soft) {
          // Keep previous good frame during mid-build incomplete graphs
          post("PREVIEW_STATUS", {
            status: "building",
            message: String(err && (err.message || err)).slice(0, 180),
          });
          return;
        }
        showError(err);
      }
    }

    function applyPayload(data) {
      if (!data) return;
      if (data.supabaseUrl) window._SUPABASE_URL = data.supabaseUrl;
      if (data.supabaseKey) window._SUPABASE_KEY = data.supabaseKey;
      ensureSupabase();
      if (!data.files || typeof data.files !== "object") {
        showError(new Error("Preview expects a multifile VFS payload."));
        return;
      }
      vfs = data.files;
      lastEntry =
        data.entryPoint ||
        (data.files["App.tsx"] ? "App.tsx" : Object.keys(data.files)[0]);
      renderVFS(lastEntry, { soft: !!data.soft });
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "EXECUTE_CODE") {
        applyPayload(data);
      } else if (data.type === "PREVIEW_PING") {
        post("PREVIEW_READY", {});
      }
    });

    function init() {
      try {
        ensureDeps();
      } catch (e) {
        showError(e);
        post("PREVIEW_READY", {});
        return;
      }

      try {
        const stored = localStorage.getItem("shipkernel_preview_data");
        if (stored) {
          const data = JSON.parse(stored);
          if (data.files && Object.keys(data.files).length) {
            applyPayload({
              files: data.files,
              supabaseUrl: data.supabaseUrl,
              supabaseKey: data.supabaseKey,
              soft: false,
            });
          } else {
            document.getElementById("root").innerHTML =
              '<div id="boot">Waiting for workspace…</div>';
          }
        } else {
          document.getElementById("root").innerHTML =
            '<div id="boot">Waiting for workspace…</div>';
        }
      } catch (_) {
        document.getElementById("root").innerHTML =
          '<div id="boot">Waiting for workspace…</div>';
      }

      post("PREVIEW_READY", {});
    }

    if (document.readyState === "complete") init();
    else window.addEventListener("load", init);
  </script>
</body>
</html>
